<nav aria-label="Paginação">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}&amp;q={{ q|urlencode }}&amp;waiting={% if waiting %}1{% else %}0{% endif %}&amp;start={{ start }}&amp;end={{ end }}">← Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}&amp;q={{ q|urlencode }}&amp;waiting={% if waiting %}1{% else %}0{% endif %}&amp;start={{ start }}&amp;end={{ end }}">Próxima →</a>{% endif %}</nav>
