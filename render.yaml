services:
  - type: web
    name: ong-lotus
    runtime: python
    region: virginia
    plan: free
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health/
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ong-lotus-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: lotus_admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "1"
databases:
  - name: ong-lotus-db
    databaseName: lotus
    user: lotus
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
